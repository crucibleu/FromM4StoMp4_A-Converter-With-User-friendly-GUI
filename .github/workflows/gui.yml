name: GUI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Install Fyne dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
    - name: Build
      run: go build -ldflags "-w -s" -o m4s-converter-gui-linux_amd64 ./gui
    - uses: actions/upload-artifact@v4
      with:
        name: m4s-converter-gui-linux_amd64
        path: m4s-converter-gui-linux_amd64

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Build
      # windows-latest 自带 MinGW gcc
      run: go build -ldflags "-w -s -H=windowsgui" -o m4s-converter-gui-amd64.exe ./gui
      env:
        CGO_ENABLED: 1
    - uses: actions/upload-artifact@v4
      with:
        name: m4s-converter-gui-amd64.exe
        path: m4s-converter-gui-amd64.exe
